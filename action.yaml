# NOTE: requires `id-token: write` on the calling job.
# To post plan output as a PR comment, also grant `pull-requests: write`.
# The comment-posting step is a no-op when the workflow isn't running for a
# pull request (e.g. direct pushes to main).

name: 'Plan Infrastructure (OpenTofu)'
description: 'Plans infrastructure changes using OpenTofu, optionally posting the result as a PR comment.'
inputs:
  aws_account_id:
    description: 'AWS Account ID for the deployment'
    type: string
    required: true
  aws_region:
    description: 'AWS Region for the deployment'
    type: string
    required: true
  env_name:
    description: 'Environment name (e.g., nonprod, prod)'
    type: string
    required: true
  infrastructure_directory:
    description: 'Directory containing infrastructure code'
    type: string
    required: false
    default: 'infra'
  iam_role_name:
    description: 'IAM role name to assume'
    type: string
    required: false
    default: 'tofu-rw'
  use_tfvars:
    description: 'Whether to pass a .tfvars file to OpenTofu'
    type: string
    required: false
    default: 'false'
  tfvars_file:
    description: 'Path to .tfvars file, relative to infrastructure_directory. Defaults to <env_name>.tfvars when use_tfvars is true.'
    type: string
    required: false
    default: ''
  post_pr_comment:
    description: 'When "true" (default), post plan output as a PR comment on pull_request events. Set to "false" to disable.'
    type: string
    required: false
    default: 'true'
  github_token:
    description: 'GITHUB_TOKEN (or PAT) used to post the PR comment. Defaults to ${{ github.token }} when omitted.'
    type: string
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/${{ inputs.iam_role_name }}
        role-session-name: GitHub_to_AWS_via_FederatedOIDC
        aws-region: ${{ inputs.aws_region }}

    - name: Setup OpenTofu CLI
      uses: opentofu/setup-opentofu@v2
      with:
        tofu_wrapper: false

    - name: OpenTofu plan
      id: plan
      shell: bash
      env:
        ENV_NAME: ${{ inputs.env_name }}
        AWS_REGION: ${{ inputs.aws_region }}
        INFRA_DIR: ${{ inputs.infrastructure_directory }}
        USE_TFVARS: ${{ inputs.use_tfvars }}
        TFVARS_FILE: ${{ inputs.tfvars_file }}
      run: |
        set -euo pipefail
        cd "$INFRA_DIR"

        VAR_FILE_ARG=""
        if [ "$USE_TFVARS" = "true" ]; then
          if [ -z "$TFVARS_FILE" ]; then
            TFVARS_FILE="${ENV_NAME}.tfvars"
          fi
          VAR_FILE_ARG="-var-file=$TFVARS_FILE"
        fi

        tofu init \
          -var="env=$ENV_NAME" \
          -var="region=$AWS_REGION" \
          $VAR_FILE_ARG

        # Capture human-readable plan output to a file so the next step can
        # surface it as a PR comment. -no-color keeps ANSI sequences out of
        # the markdown block.
        PLAN_OUTPUT_PATH="${RUNNER_TEMP:-/tmp}/tofu-plan-${ENV_NAME}.txt"
        set +e
        tofu plan -no-color \
          -var="env=$ENV_NAME" \
          -var="region=$AWS_REGION" \
          $VAR_FILE_ARG \
          | tee "$PLAN_OUTPUT_PATH"
        PLAN_EXIT=${PIPESTATUS[0]}
        set -e

        echo "plan_output_path=$PLAN_OUTPUT_PATH" >> "$GITHUB_OUTPUT"
        echo "plan_exit_code=$PLAN_EXIT" >> "$GITHUB_OUTPUT"

        # Surface the plan exit code as the step's exit code so failures still
        # block the workflow even though we tee'd the output.
        exit $PLAN_EXIT

    - name: Post plan to PR
      if: ${{ always() && github.event_name == 'pull_request' && inputs.post_pr_comment == 'true' }}
      uses: actions/github-script@v7
      env:
        PLAN_OUTPUT_PATH: ${{ steps.plan.outputs.plan_output_path }}
        PLAN_EXIT_CODE: ${{ steps.plan.outputs.plan_exit_code }}
        ENV_NAME: ${{ inputs.env_name }}
        INFRA_DIR: ${{ inputs.infrastructure_directory }}
      with:
        github-token: ${{ inputs.github_token || github.token }}
        script: |
          const fs = require('fs');
          const { PLAN_OUTPUT_PATH, PLAN_EXIT_CODE, ENV_NAME, INFRA_DIR } = process.env;

          // The comment uses a marker so subsequent runs update in place
          // instead of stacking duplicates on every push to the PR branch.
          const marker = `<!-- tofu-plan:${ENV_NAME}:${INFRA_DIR} -->`;
          const MAX_BODY = 60000; // GH allows 65536, leave headroom for the wrapper

          let plan = '';
          try {
            plan = fs.readFileSync(PLAN_OUTPUT_PATH, 'utf8');
          } catch (e) {
            plan = `(could not read plan output: ${e.message})`;
          }

          let truncatedNote = '';
          if (plan.length > MAX_BODY) {
            truncatedNote = `\n\n⚠️ Plan truncated — full output in the workflow logs (${plan.length} chars).`;
            plan = plan.slice(0, MAX_BODY);
          }

          const status = PLAN_EXIT_CODE === '0' ? '✅ ok' : `❌ failed (exit ${PLAN_EXIT_CODE})`;
          const body = [
            marker,
            `### OpenTofu plan — \`${ENV_NAME}\` (${INFRA_DIR})`,
            `Status: ${status}`,
            '',
            '```',
            plan,
            '```',
            truncatedNote,
          ].join('\n');

          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;

          const existing = await github.paginate(
            github.rest.issues.listComments,
            { owner, repo, issue_number, per_page: 100 },
          );
          const prior = existing.find((c) => c.body && c.body.startsWith(marker));

          if (prior) {
            await github.rest.issues.updateComment({
              owner, repo, comment_id: prior.id, body,
            });
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            });
          }
