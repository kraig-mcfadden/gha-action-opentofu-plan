# NOTE: requires id-token: write permissions!

name: 'Plan Infrastructure (OpenTofu)'
description: 'Plans infrastructure changes using OpenTofu'
inputs:
  aws_account_id:
    description: 'AWS Account ID for the deployment'
    type: string
    required: true
  aws_region:
    description: 'AWS Region for the deployment'
    type: string
    required: true
  env_name:
    description: 'Environment name (e.g., nonprod, prod)'
    type: string
    required: true
  infrastructure_directory:
    description: 'Directory containing infrastructure code'
    type: string
    required: false
    default: 'infra'
  iam_role_name:
    description: 'IAM role name to assume'
    type: string
    required: false
    default: 'tofu-rw'
  use_tfvars:
    description: 'Whether to pass a .tfvars file to OpenTofu'
    type: string
    required: false
    default: 'false'
  tfvars_file:
    description: 'Path to .tfvars file, relative to infrastructure_directory. Defaults to <env_name>.tfvars when use_tfvars is true.'
    type: string
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/${{ inputs.iam_role_name }}
        role-session-name: GitHub_to_AWS_via_FederatedOIDC
        aws-region: ${{ inputs.aws_region }}

    - name: Setup OpenTofu CLI
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_wrapper: false

    - name: OpenTofu plan
      shell: bash
      run: |
        cd ${{ inputs.infrastructure_directory }}
        VAR_FILE_ARG=""
        if [ "${{ inputs.use_tfvars }}" = "true" ]; then
          TFVARS_FILE="${{ inputs.tfvars_file }}"
          if [ -z "$TFVARS_FILE" ]; then
            TFVARS_FILE="${{ inputs.env_name }}.tfvars"
          fi
          VAR_FILE_ARG="-var-file=$TFVARS_FILE"
        fi
        tofu init -var="env=${{ inputs.env_name }}" -var="region=${{ inputs.aws_region }}" $VAR_FILE_ARG
        tofu plan -var="env=${{ inputs.env_name }}" -var="region=${{ inputs.aws_region }}" $VAR_FILE_ARG
